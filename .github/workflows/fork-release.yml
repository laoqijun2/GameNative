name: Fork release (APK)

# Builds the release APKs on GitHub's runners and publishes them as GitHub
# Release assets.
#
# The repository's own release workflows (tagged-release.yml,
# app-release-signed.yml) sign with the maintainers' keystore secrets, which a
# fork does not have. The `release` build type signs with the standard debug key
# instead, and is still non-debuggable, so builds produced here install normally
# and are safe to hand out; users just have to uninstall a copy signed with a
# different key before installing one of these.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish, e.g. fork-v1.4.0 (default: fork-<run number>)'
        required: false
        default: ''
  push:
    tags:
      - 'fork-v*'

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [Modern, Legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc || true
          df -h /

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The app reads these from local.properties. Dummy values keep the build
      # self-contained; nothing here talks to PostHog at build time.
      - name: Inject placeholder credentials
        run: |
          cat > local.properties <<'EOF'
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_bin="$(find "$sdk/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          echo "sdk=$sdk sdkmanager=$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" --install "build-tools;34.0.0" "platforms;android-36"

      - name: Build ${{ matrix.variant }} release APK
        run: ./gradlew :app:assemble${{ matrix.variant }}Release -x lint

      - name: Verify APK
        run: |
          set -uo pipefail
          variant_lc="$(echo '${{ matrix.variant }}' | tr '[:upper:]' '[:lower:]')"
          apk="app/build/outputs/apk/$variant_lc/release/app-$variant_lc-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::APK not found at $apk"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          echo "APK: $apk ($(stat -c%s "$apk") bytes)"

          aapt2="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)"
          "$aapt2" dump badging "$apk" > badging.txt
          if grep -q "application-debuggable" badging.txt; then
            echo "::error::release APK is debuggable"
            exit 1
          fi
          echo "APK is not debuggable"

          # A 4 KB library cannot be mapped at all when Android boots with 16 KB
          # pages, so the modern flavour's arm64 libraries must all declare it.
          rm -rf apk-lib && mkdir -p apk-lib
          unzip -o -q "$apk" 'lib/arm64-v8a/*.so' -d apk-lib
          python3 - "$variant_lc" <<'PY'
          import pathlib, struct, sys

          variant = sys.argv[1]
          libs = sorted(pathlib.Path("apk-lib/lib/arm64-v8a").glob("*.so"))
          if not libs:
              sys.exit("::error::no arm64 libraries found in the APK")

          bad = []
          for lib in libs:
              data = lib.read_bytes()
              if data[:4] != b"\x7fELF" or data[4] != 2:
                  bad.append(f"{lib.name}: not an ELF64 file")
                  continue
              # e_phoff at 0x20, e_phentsize at 0x36, e_phnum at 0x38
              phoff, = struct.unpack_from("<Q", data, 0x20)
              phentsize, phnum = struct.unpack_from("<HH", data, 0x36)
              aligns = []
              for i in range(phnum):
                  off = phoff + i * phentsize
                  p_type, = struct.unpack_from("<I", data, off)
                  if p_type == 1:  # PT_LOAD
                      p_align, = struct.unpack_from("<Q", data, off + 48)
                      aligns.append(p_align)
              if aligns and min(aligns) < 0x4000:
                  bad.append(f"{lib.name}: PT_LOAD align {min(aligns):#x}")

          for lib in libs:
              print("checked", lib.name)
          if bad:
              message = "; ".join(bad)
              if variant == "modern":
                  sys.exit(f"::error::16 KB alignment required in the modern flavour: {message}")
              # The legacy flavour ships prebuilt 4 KB libraries and targets old
              # devices; report it but do not fail the build.
              print(f"::warning::legacy flavour ships 4 KB libraries: {message}")
          else:
              print(f"all {len(libs)} arm64 libraries are 16 KB aligned")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: app/build/outputs/apk/*/release/app-*-release.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: apk-*

      - name: Locate the APKs
        id: apks
        run: |
          set -euo pipefail
          # upload-artifact keeps the path relative to the search root, so the files
          # land as artifacts/<flavour>/release/app-<flavour>-release.apk.
          find artifacts -name '*.apk' -type f | tee apks.txt
          count=$(wc -l < apks.txt)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 APKs, found $count"
            exit 1
          fi

      - name: Work out release tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ inputs.version }}"
          if [ -z "$tag" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              tag="${GITHUB_REF_NAME}"
            else
              tag="fork-${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          ls -la artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: GameNative ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: true
          body: |
            APK built from `${{ github.sha }}` by the `Fork release (APK)` workflow
            on GitHub's runners.

            - modern flavour: `targetSdk 36`, arm64 only, all native libraries
              16 KB aligned
            - legacy flavour: `targetSdk 28`, arm64 + armv7, for older devices
            - signed with the debug key (the fork has no maintainer keystore), so
              uninstall any copy signed with a different key first

            Download extras on top of upstream `master`:

            - Steam CDN: keep China-only servers as a tail fallback, and fall back
              to built-in Asia-Pacific edges / Perfect World partner CDNs when the
              directory yields nothing usable
            - Steam CDN: probe every host before the first chunk and quarantine the
              ones that never answer (the stall users see after a while)
            - fetch engine: escalate host cooldowns for timeout/connect failures
              (3 s → 15 s → 60 s) instead of retrying a dead host every <=4 s
            - download settings: optional Adaptive tier (opt-in; default unchanged)
          files: |
            artifacts/**/app-modern-release.apk
            artifacts/**/app-legacy-release.apk
          fail_on_unmatched_files: true
